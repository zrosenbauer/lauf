<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 430">
  <defs>
    <style>
      .text { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .code { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 12px; }
      .ln { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #45475a; text-anchor: end; }
      .tab { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #cdd6f4; }
      .brand { fill: #74c7ec; }
      .dim { fill: #6c7086; }
      .kw { fill: #cba6f7; }
      .fn { fill: #89b4fa; }
      .st { fill: #a6e3a1; }
      .pr { fill: #94e2d5; }
      .vr { fill: #fab387; }
      .tx { fill: #cdd6f4; }
      .op { fill: #9399b2; }
      .cyan { fill: #89dceb; }
      .prompt { fill: #89b4fa; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="838" height="430" rx="10" ry="10" fill="#1e1e2e" />

  <!-- Title bar -->
  <rect width="838" height="36" rx="10" ry="10" fill="#181825" />
  <rect y="26" width="838" height="10" fill="#181825" />

  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" fill="#f38ba8" />
  <circle cx="40" cy="18" r="6" fill="#f9e2af" />
  <circle cx="60" cy="18" r="6" fill="#a6e3a1" />

  <!-- Title bar text -->
  <text class="text dim" font-size="12" x="419" y="22" text-anchor="middle">lauf</text>

  <!-- ASCII art logo (centered) -->
  <g transform="translate(290, 0)">
    <text class="text brand" font-size="13" y="68" xml:space="preserve">██╗      █████╗ ██╗   ██╗███████╗</text>
    <text class="text brand" font-size="13" y="84" xml:space="preserve">██║     ██╔══██╗██║   ██║██╔════╝</text>
    <text class="text brand" font-size="13" y="100" xml:space="preserve">██║     ███████║██║   ██║█████╗  </text>
    <text class="text brand" font-size="13" y="116" xml:space="preserve">██║     ██╔══██║██║   ██║██╔══╝  </text>
    <text class="text brand" font-size="13" y="132" xml:space="preserve">███████╗██║  ██║╚██████╔╝██║     </text>
    <text class="text brand" font-size="13" y="148" xml:space="preserve">╚══════╝╚═╝  ╚═╝ ╚═════╝ ╚═╝     </text>
  </g>

  <!-- Tagline -->
  <text class="text dim" font-size="12" x="419" y="172" text-anchor="middle">discover, validate, and execute typed scripts across your monorepo</text>

  <!-- Separator -->
  <line x1="16" y1="188" x2="822" y2="188" stroke="#313244" stroke-width="1" />

  <!-- Split pane divider -->
  <line x1="419" y1="188" x2="419" y2="424" stroke="#313244" stroke-width="1" />

  <!-- ================================================ -->
  <!-- LEFT PANE: terminal (CLI running the script)     -->
  <!-- ================================================ -->
  <rect x="4" y="192" width="80" height="24" rx="4" ry="4" fill="#181825" />
  <text class="tab" x="18" y="208">terminal</text>

  <text class="code" x="18" y="236"><tspan class="prompt">~</tspan><tspan class="dim"> $ </tspan><tspan class="tx">lauf run docs/gen-docs </tspan><tspan class="pr">--format</tspan><tspan class="vr"> md</tspan></text>

  <!-- Running docs/gen-docs... -->
  <text class="code" x="18" y="264"><tspan class="dim">Running </tspan><tspan class="cyan">docs/gen-docs</tspan><tspan class="dim">...</tspan></text>

  <!-- Generated file list -->
  <text class="code" x="18" y="288" xml:space="preserve"><tspan class="st">  ✓</tspan><tspan class="tx"> erd.md</tspan></text>
  <text class="code" x="18" y="304" xml:space="preserve"><tspan class="st">  ✓</tspan><tspan class="tx"> architecture.md</tspan></text>
  <text class="code" x="18" y="320" xml:space="preserve"><tspan class="st">  ✓</tspan><tspan class="tx"> reference.md</tspan></text>
  <text class="code" x="18" y="336" xml:space="preserve"><tspan class="st">  ✓</tspan><tspan class="tx"> changelog.md</tspan></text>

  <!-- Summary -->
  <text class="code" x="18" y="364"><tspan class="dim">Done — 4 files generated</tspan></text>

  <!-- New prompt with cursor -->
  <text class="code" x="18" y="396"><tspan class="prompt">~</tspan><tspan class="dim"> $ </tspan><tspan class="tx">&#x2588;</tspan></text>

  <!-- ================================================ -->
  <!-- RIGHT PANE: gen-docs.ts (script definition)       -->
  <!-- ================================================ -->
  <rect x="423" y="192" width="100" height="24" rx="4" ry="4" fill="#181825" />
  <text class="tab" x="437" y="208">gen-docs.ts</text>

  <line x1="457" y1="220" x2="457" y2="424" stroke="#313244" stroke-width="1" />

  <!-- Line numbers -->
  <text class="ln" x="449" y="236">1</text>
  <text class="ln" x="449" y="252">2</text>
  <text class="ln" x="449" y="268">3</text>
  <text class="ln" x="449" y="284">4</text>
  <text class="ln" x="449" y="300">5</text>
  <text class="ln" x="449" y="316">6</text>
  <text class="ln" x="449" y="332">7</text>
  <text class="ln" x="449" y="348">8</text>
  <text class="ln" x="449" y="364">9</text>
  <text class="ln" x="449" y="380">10</text>
  <text class="ln" x="449" y="396">11</text>
  <text class="ln" x="449" y="412">12</text>

  <!-- Line 1: import { lauf, z } from 'lauf' -->
  <text class="code" x="467" y="236"><tspan class="kw">import</tspan><tspan class="op"> { </tspan><tspan class="fn">lauf</tspan><tspan class="op">, </tspan><tspan class="fn">z</tspan><tspan class="op"> } </tspan><tspan class="kw">from</tspan><tspan class="st"> 'lauf'</tspan></text>

  <!-- Line 2: import { generate } from '../lib/docs' -->
  <text class="code" x="467" y="252"><tspan class="kw">import</tspan><tspan class="op"> { </tspan><tspan class="fn">generate</tspan><tspan class="op"> } </tspan><tspan class="kw">from</tspan><tspan class="st"> '../lib/docs'</tspan></text>

  <!-- Line 3: (empty) -->

  <!-- Line 4: export default lauf({ -->
  <text class="code" x="467" y="284"><tspan class="kw">export default </tspan><tspan class="fn">lauf</tspan><tspan class="op">({</tspan></text>

  <!-- Line 5:   description: 'Generate docs', -->
  <text class="code" x="467" y="300" xml:space="preserve"><tspan class="op">  </tspan><tspan class="pr">description</tspan><tspan class="op">: </tspan><tspan class="st">'Generate docs'</tspan><tspan class="op">,</tspan></text>

  <!-- Line 6:   args: { -->
  <text class="code" x="467" y="316" xml:space="preserve"><tspan class="op">  </tspan><tspan class="pr">args</tspan><tspan class="op">: {</tspan></text>

  <!-- Line 7:     format: z.string(), -->
  <text class="code" x="467" y="332" xml:space="preserve"><tspan class="op">    </tspan><tspan class="pr">format</tspan><tspan class="op">: </tspan><tspan class="fn">z</tspan><tspan class="op">.</tspan><tspan class="fn">string</tspan><tspan class="op">(),</tspan></text>

  <!-- Line 8:   }, -->
  <text class="code" x="467" y="348" xml:space="preserve"><tspan class="op">  },</tspan></text>

  <!-- Line 9:   async run(ctx) { -->
  <text class="code" x="467" y="364" xml:space="preserve"><tspan class="op">  </tspan><tspan class="kw">async </tspan><tspan class="fn">run</tspan><tspan class="op">(</tspan><tspan class="vr">ctx</tspan><tspan class="op">) {</tspan></text>

  <!-- Line 10:     await generate(ctx.args.format) -->
  <text class="code" x="467" y="380" xml:space="preserve"><tspan class="op">    </tspan><tspan class="kw">await </tspan><tspan class="fn">generate</tspan><tspan class="op">(</tspan><tspan class="vr">ctx</tspan><tspan class="op">.</tspan><tspan class="pr">args</tspan><tspan class="op">.</tspan><tspan class="pr">format</tspan><tspan class="op">)</tspan></text>

  <!-- Line 11:   }, -->
  <text class="code" x="467" y="396" xml:space="preserve"><tspan class="op">  },</tspan></text>

  <!-- Line 12: }) -->
  <text class="code" x="467" y="412"><tspan class="op">})</tspan></text>

</svg>
