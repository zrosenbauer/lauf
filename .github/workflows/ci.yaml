name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec oxlint --format github

      - name: Format
        run: pnpm fmt:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: |
          echo "::add-matcher::.github/problem-matchers/tsc.json"
          pnpm exec tsc -b --noEmit --pretty false

      - name: Test
        run: pnpm test
