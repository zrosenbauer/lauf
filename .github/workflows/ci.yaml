name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0

      - name: Lint (PR)
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          pnpm exec oxlint --format checkstyle | reviewdog \
            -f=checkstyle \
            -name="oxlint" \
            -reporter=github-pr-check \
            -level=error \
            -fail-on-error \
            -filter-mode=added

      - name: Lint
        if: github.event_name != 'pull_request'
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Typecheck (PR)
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          pnpm --filter laufen exec tsc --noEmit 2>&1 | reviewdog \
            -f=tsc \
            -name="tsc" \
            -reporter=github-pr-check \
            -level=error \
            -fail-on-error \
            -filter-mode=nofilter

      - name: Typecheck
        if: github.event_name != 'pull_request'
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
