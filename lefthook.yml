commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-commit:
  commands:
    sync-pkg-meta:
      run: pnpm lauf run lauf-monorepo/sync-pkg-meta && git add packages/laufen/README.md packages/laufen/LICENSE
    format:
      glob: '*.{ts,tsx,js,jsx,json,md,yaml,yml}'
      run: pnpm fmt {staged_files} && git add {staged_files}

pre-push:
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
